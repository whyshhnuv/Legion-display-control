name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the build; empty for the version in Directory.Build.props
        type: string
        required: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DisplayToolkit.slnx

      - name: Build
        run: dotnet build DisplayToolkit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DisplayToolkit.slnx --configuration Release --no-build

      # Builds the same artifacts the tag-triggered release workflow builds (zip and msi), downloadable from the run.
      - name: Publish
        if: github.event != 'pull_request'
        shell: pwsh
        env:
          CI_VERSION: ${{ inputs.version }}
        run: |
          if ($env:CI_VERSION) { ./build/publish.ps1 -Version $env:CI_VERSION } else { ./build/publish.ps1 }

      - name: Upload artifacts
        if: github.event != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DisplayToolkit
          path: |
            artifacts/*.zip
            artifacts/*.msi
